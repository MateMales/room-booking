services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: room_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d room_booking"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/room_booking
      DB_PASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy